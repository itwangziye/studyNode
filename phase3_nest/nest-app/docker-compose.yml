services:
  app:
    build: "."                    # ← 用当前目录的 Dockerfile 构建
    restart: always                   # ← 崩溃自动重启,填什么?
    environment:
      DATABASE_URL: ${DATABASE_URL}           # ← 从 .env 读,怎么写?
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
    ports:
      - "3000:3000"                  # ← 宿主机端口:容器端口